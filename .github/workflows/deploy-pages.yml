# Publishes the grader app (frontend/dist) to GitHub Pages.
#
# ONE-TIME: in the repo, go to Settings → Pages → "Build and deployment" →
# Source: "GitHub Actions". After that, every push to main that changes
# frontend/dist will publish the app at:
#   https://<owner>.github.io/<repo>/
name: Deploy grader app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/dist/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v4
